<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            background: black;
            display: grid;
            place-items: center;
            height: 100vh;
        }
        .container {
            position: relative; /* Centers and anchors absolute child flames */
            width: 60px;
            height: 60px;
            transform-origin: center bottom;
            animation: flicker 100ms ease-in infinite alternate; /* 3ms is nearly invisible; ~100ms flickers naturally */
        }
        .flame {
            bottom: 0;
            position: absolute;
            border-bottom-right-radius: 50%;
            border-bottom-left-radius: 50%;
            border-top-left-radius: 50%;
            transform: rotate(-45deg) scale(1.5, 1.5);
        }
        .yellow {
            left: 15px;
            width: 30px;
            height: 30px;
            background: gold;
            box-shadow: 0px 0px 9px 4px gold;
        }
        .orange {
            left: 10px;
            width: 40px;
            height: 40px;
            background: orange;
            box-shadow: 0px 0px 9px 4px orange;
        }
        .red {
            left: 5px;
            width: 50px;
            height: 50px;
            background: orangered;
            box-shadow: 0px 0px 9px 4px red;
        }
        .white {
            left: 15px;
            bottom: -4px;
            width: 30px;
            height: 30px;
            background: white;
            box-shadow: 0px 0px 9px 4px white;
        }
        .blue {
            width: 10px;
            height: 10px;
            left: 25px;
            bottom: -25px;
            background: SlateBlue;
            box-shadow: 0px 0px 15px 10px SlateBlue;
        }
        .black {
            width: 40px;
            height: 40px;
            left: 10px;
            bottom: -60px;
            background: black;
            box-shadow: 0px 0px 15px 10px black;
        }
        @keyframes flicker {
            0%   { transform: rotate(-1deg); }
            20%  { transform: rotate(1deg); }
            40%  { transform: rotate(-1deg); }
            60%  { transform: rotate(1deg) scaleY(1.04); }
            80%  { transform: rotate(-2deg) scaleY(0.92); }
            100% { transform: rotate(1deg); } 
        }
    </style>
</head>
<body>
    <!-- Fixed typo from "contanier" to "container" -->
    <div class="container">
        <div class="red flame"></div>
        <div class="orange flame"></div>
        <div class="yellow flame"></div>
        <div class="white flame"></div>
        <div class="blue flame"></div>
        <div class="black flame"></div>
    </div>
</body>
</html>
